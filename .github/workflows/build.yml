name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ArctixC and run tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ArctixC/build.ps1
